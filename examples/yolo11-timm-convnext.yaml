# Ultralytics YOLO11 detection model with a timm ConvNeXt-Tiny backbone
# Install with: pip install 'ultralytics[timm]'

nc: 80

# timm features_only indices (1, 2, 3): P3/8 (192), P4/16 (384), P5/32 (768).
# Set pretrained=True to initialize the backbone from timm weights (download required).
backbone:
  - [-1, 1, Timm, [768, convnext_tiny, False, [1, 2, 3]]]
  - [0, 1, Index, [192, 0]] # P3/8
  - [0, 1, Index, [384, 1]] # P4/16
  - [0, 1, Index, [768, 2]] # P5/32

head:
  - [3, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, C3k2, [384, False]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 1, C3k2, [192, False]] # P3/8
  - [-1, 1, Conv, [192, 3, 2]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C3k2, [384, False]] # P4/16
  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 1, C3k2, [768, False]] # P5/32
  - [[9, 12, 15], 1, Detect, [nc]]
